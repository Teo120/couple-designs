{% extends "base.html" %}
{% block title %}Contact - Couple Designs{% endblock %}
{% block content %}

<div class="page-hero">
    <h1>Contact</h1>
    <p>Suntem aici să te ajutăm. Scrie-ne!</p>
</div>

<div class="page-content">
    <div class="contact-form">

        <form action="/send-message" method="POST">

            <div class="form-group">
                <label>Numele tău</label>
                <input type="text" name="name" placeholder="Ex: Andrei & Maria" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="email@exemplu.ro" required>
            </div>

            <div class="form-group">
                <label>Mesaj</label>
                <textarea name="message" placeholder="Scrie mesajul tău aici..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">
                Trimite Mesajul ♡
            </button>

        </form>

    </div>
</div>

{% endblock %}
